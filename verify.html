<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify a Certificate — ORIZIS Academy</title>
    <meta name="description" content="Verify the authenticity of an ORIZIS Academy Certificate of Completion using its verification code.">
    <meta name="theme-color" content="#4338ca">
    <link rel="icon" type="image/png" href="icon-192.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = { theme: { extend: {
            colors: { ink: { 50:'#eef2ff',100:'#e0e7ff',200:'#c7d2fe',500:'#6366f1',600:'#4f46e5',700:'#4338ca',800:'#3730a3',900:'#312e81' }, gold:{ DEFAULT:'#e3ae4e', soft:'#f4d58d' }, zam:{ green:'#198a00', red:'#de2010' } },
            fontFamily: { sans:['Inter','sans-serif'], display:['"Playfair Display"','serif'] }
        } } }
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="config.js"></script>
</head>
<body class="bg-ink-50 font-sans text-slate-800 min-h-screen flex flex-col">
    <header class="bg-white shadow-sm">
        <div class="max-w-4xl mx-auto px-4 py-3 flex items-center gap-2">
            <a href="index.html" class="flex items-center gap-2">
                <div class="bg-gradient-to-br from-ink-600 to-ink-800 text-white w-10 h-10 rounded-xl flex items-center justify-center text-lg shadow-md"><i class="fas fa-graduation-cap"></i></div>
                <div>
                    <h1 class="text-lg font-display font-extrabold leading-none">ORIZIS <span class="text-ink-600">Academy</span></h1>
                    <p class="text-[10px] text-slate-400 leading-none mt-0.5">Certificate verification</p>
                </div>
            </a>
        </div>
    </header>

    <main class="flex-1 max-w-2xl w-full mx-auto px-4 py-10">
        <h2 class="text-2xl sm:text-3xl font-display font-extrabold text-center">Verify a Certificate</h2>
        <p class="text-center text-slate-500 mt-2">Enter the verification code from an ORIZIS Academy certificate to confirm it is genuine.</p>

        <div class="mt-6 flex gap-2 max-w-md mx-auto">
            <input id="codeInput" type="text" placeholder="e.g. OA-AB12C-XY9Z"
                class="flex-1 border-2 border-ink-500 rounded-xl px-4 py-3 text-sm uppercase focus:outline-none focus:ring-2 focus:ring-ink-100"
                onkeydown="if(event.key==='Enter') doVerify()">
            <button onclick="doVerify()" class="bg-ink-600 hover:bg-ink-700 text-white font-bold px-6 rounded-xl transition"><i class="fas fa-shield-halved mr-1"></i>Verify</button>
        </div>

        <div id="result" class="mt-8"></div>
    </main>

    <footer class="bg-[#0b1020] text-ink-100/50 text-center py-4 text-xs">
        © 2026 ORIZIS Academy · an ORIZIS TECHNOLOGY brand · <a href="index.html" class="hover:text-white underline">Back to courses</a>
    </footer>

    <script>
    const CONFIG = window.OA_CONFIG || {};
    const firebaseReady = !!(CONFIG.firebase && CONFIG.firebase.apiKey && CONFIG.firebase.projectId);
    let db = null;
    if (firebaseReady) { try { firebase.initializeApp(CONFIG.firebase); db = firebase.firestore(); } catch (e) {} }
    const $ = id => document.getElementById(id);
    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
    const fmtDate = d => { try { return new Date(d).toLocaleDateString('en-GB', { day:'numeric', month:'long', year:'numeric' }); } catch (e) { return d; } };

    async function lookup(code) {
        if (db) {
            const snap = await db.collection('certificates').doc(code).get();
            return snap.exists ? snap.data() : null;
        }
        // Demo / no-Firebase fallback: only certificates issued on THIS device
        const raw = localStorage.getItem('oa_cert_' + code);
        return raw ? JSON.parse(raw) : null;
    }

    function showValid(c) {
        $('result').innerHTML = `
            <div class="bg-white rounded-2xl border-2 border-zam-green shadow-sm overflow-hidden fade-in">
                <div class="bg-zam-green text-white px-6 py-4 flex items-center gap-3">
                    <i class="fas fa-circle-check text-3xl"></i>
                    <div><div class="font-extrabold text-lg">Certificate verified</div><div class="text-emerald-100 text-sm">This is a genuine ORIZIS Academy certificate.</div></div>
                </div>
                <div class="p-6 space-y-3 text-sm">
                    <div class="flex justify-between border-b border-slate-100 pb-2"><span class="text-slate-400">Name</span><span class="font-bold text-right">${esc(c.userName)}</span></div>
                    <div class="flex justify-between border-b border-slate-100 pb-2"><span class="text-slate-400">Course</span><span class="font-bold text-right">${esc(c.courseTitle)}</span></div>
                    ${c.level ? `<div class="flex justify-between border-b border-slate-100 pb-2"><span class="text-slate-400">Level</span><span class="font-semibold text-right">${esc(c.level)}</span></div>` : ''}
                    ${c.scorePercent ? `<div class="flex justify-between border-b border-slate-100 pb-2"><span class="text-slate-400">Exam score</span><span class="font-semibold text-right">${esc(c.scorePercent)}%</span></div>` : ''}
                    <div class="flex justify-between border-b border-slate-100 pb-2"><span class="text-slate-400">Date issued</span><span class="font-semibold text-right">${esc(fmtDate(c.issuedAt))}</span></div>
                    <div class="flex justify-between"><span class="text-slate-400">Verification code</span><span class="font-mono font-bold text-right">${esc(c.certId || '')}</span></div>
                </div>
                <div class="px-6 pb-5 text-[11px] text-slate-400">ORIZIS Academy issues Certificates of Completion. This is not a government- or TEVETA-accredited qualification.</div>
            </div>`;
    }

    function showInvalid(code, demo) {
        $('result').innerHTML = `
            <div class="bg-white rounded-2xl border-2 border-zam-red shadow-sm overflow-hidden fade-in">
                <div class="bg-zam-red text-white px-6 py-4 flex items-center gap-3">
                    <i class="fas fa-circle-xmark text-3xl"></i>
                    <div><div class="font-extrabold text-lg">Not found</div><div class="text-red-100 text-sm">No certificate matches code <b>${esc(code)}</b>.</div></div>
                </div>
                <div class="p-6 text-sm text-slate-600">
                    <p>Please check the code and try again. Codes look like <span class="font-mono">OA-AB12C-XY9Z</span> and are printed on the certificate.</p>
                    ${demo ? `<p class="mt-3 text-[12px] text-amber-600"><i class="fas fa-triangle-exclamation mr-1"></i> This site is running in demo mode (Firebase not configured), so only certificates created on this device can be verified.</p>` : ''}
                </div>
            </div>`;
    }

    async function doVerify() {
        const code = $('codeInput').value.trim().toUpperCase();
        if (!code) return;
        history.replaceState(null, '', '?id=' + encodeURIComponent(code));
        $('result').innerHTML = `<div class="text-center py-10 text-slate-400"><i class="fas fa-spinner fa-spin text-2xl"></i><p class="mt-2 text-sm">Checking…</p></div>`;
        try {
            const c = await lookup(code);
            if (c) showValid(c); else showInvalid(code, !db);
        } catch (e) {
            showInvalid(code, !db);
        }
    }

    // Auto-verify if ?id= is present
    (function () {
        const id = new URLSearchParams(location.search).get('id');
        if (id) { $('codeInput').value = id.toUpperCase(); doVerify(); }
    })();
    </script>
</body>
</html>
